<input
  type="text"
  [(ngModel)]="query"
  (keyup.enter)="onSearch()"
  placeholder="Search for a word..."
/>
<button (click)="onSearch()">Search</button>

@if (results.length > 0) {
  <ul>
    @for (word of results; track word.id) {
      <li style="list-style:none;">
        <app-word-tree-node [word]="word"></app-word-tree-node>
      </li>
    }
  </ul>
}
